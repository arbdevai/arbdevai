<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
  .name{font:700 54px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#f0f6fc;letter-spacing:3px}
  .muted{fill:#7d8590}.blue{fill:#58a6ff}.green{fill:#3fb950}
  .cursor{animation:blink 1s steps(1) infinite}.scan{animation:scan 5s linear infinite}.pulse{animation:pulse 2.2s ease-in-out infinite}
  @keyframes blink{50%{opacity:0}} @keyframes scan{from{transform:translateX(-900px)}to{transform:translateX(900px)}} @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
