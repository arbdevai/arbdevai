<text x="450" y="29" text-anchor="middle" class="mono muted" font-size="12">arbdevai://profile/session</text>
<text x="48" y="91" class="mono blue" font-size="13">$ whoami</text>
<text x="48" y="157" class="name">SAHAL ARBANI</text>
